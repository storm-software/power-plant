[package]
authors       = { workspace = true }
categories    = { workspace = true }
description   = '☢️ Shared functionality and type definitions used across the Power Plant runtime.'
documentation = 'https://docs.rs/power-plant'
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
name          = 'power-plant-core'
publish       = true
readme        = './README.md'
repository    = { workspace = true }
version       = '0.1.6'

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
camino             = { workspace = true }
chrono             = { workspace = true }
config             = { workspace = true, features = ['json'] }
derive_more        = { workspace = true }
dirs               = { workspace = true }
power-plant-models = { workspace = true }
serde              = { workspace = true, features = ['derive'], optional = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
url                = { workspace = true }
uuid               = { workspace = true }
whoami             = { workspace = true }

[features]
default = ['serde']
serde   = ['dep:serde']
