[package]
authors       = { workspace = true }
categories    = { workspace = true }
description   = 'Execution persistence for the Power Plant runtime.'
documentation = 'https://docs.rs/power-plant'
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
name          = 'power-plant-storage'
publish       = true
readme        = './README.md'
repository    = { workspace = true }
version       = '0.1.6'

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
blake3             = { workspace = true }
camino             = { workspace = true }
chrono             = { workspace = true, features = ['serde'], optional = true }
lbug               = { workspace = true, optional = true }
power-plant-core   = { workspace = true }
power-plant-models = { workspace = true }
serde              = { workspace = true, features = ['derive'] }
serde_json         = { workspace = true }
thiserror          = '2.0.12'

[features]
default = []
ladybug = ['dep:chrono', 'dep:lbug']
testing = []

[dev-dependencies]
chrono             = { workspace = true, features = ['serde'] }
power-plant-models = { workspace = true }
serde_json         = { workspace = true }
