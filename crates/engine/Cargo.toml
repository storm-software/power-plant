[package]
authors       = { workspace = true }
categories    = { workspace = true }
description   = '☢️ Text generation that gives your AI superpowers.'
documentation = 'https://docs.rs/power-plant'
edition       = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
name          = 'power-plant-engine'
private       = false
publish       = true
readme        = './README.md'
repository    = { workspace = true }
version       = '0.1.6'

[package.metadata.cargo-shear]
ignored = ['serde', 'serde_json']

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
power-plant-core    = { workspace = true }
power-plant-models  = { workspace = true }
power-plant-storage = { workspace = true }
power-plant-tracing = { workspace = true }
power-plant-utils   = { workspace = true }
arcstr              = { workspace = true }
ariadne             = { workspace = true }
blake3              = { workspace = true }
camino              = { workspace = true }
derive_more         = { workspace = true }
rayon               = { workspace = true }
regex               = { workspace = true }
rustc-hash          = { workspace = true }
schemars            = { workspace = true, optional = true }
serde               = { workspace = true, features = ['derive'], optional = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true, features = ['rt', 'macros', 'sync', 'time'] }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[features]
default      = ['serde']
experimental = []
ladybug      = ['power-plant-storage/ladybug']
serde        = ['dep:serde']
testing      = []

[dev-dependencies]
chrono              = { workspace = true, features = ['serde'] }
power-plant-models  = { workspace = true }
power-plant-storage = { workspace = true, features = ['testing'] }
serde_json          = { workspace = true }
